name: Playwright QA Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # nightly regression run
  workflow_dispatch: {}

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Type check
        run: npm run lint

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          FINSERVE_BASE_URL: ${{ secrets.FINSERVE_BASE_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
          QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
          INVESTOR_USER_EMAIL: ${{ secrets.INVESTOR_USER_EMAIL }}
          INVESTOR_USER_PASSWORD: ${{ secrets.INVESTOR_USER_PASSWORD }}
          LEARNER_USER_EMAIL: ${{ secrets.LEARNER_USER_EMAIL }}
          LEARNER_USER_PASSWORD: ${{ secrets.LEARNER_USER_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: reports/
          retention-days: 14

      - name: Upload failure artifacts (screenshots, traces, videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-evidence
          path: test-artifacts/
          retention-days: 14

  regression:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: smoke
    if: github.event_name == 'schedule' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run regression suite
        run: npm run test:regression
        env:
          FINSERVE_BASE_URL: ${{ secrets.FINSERVE_BASE_URL }}
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          QA_USER_EMAIL: ${{ secrets.QA_USER_EMAIL }}
          QA_USER_PASSWORD: ${{ secrets.QA_USER_PASSWORD }}
          INVESTOR_USER_EMAIL: ${{ secrets.INVESTOR_USER_EMAIL }}
          INVESTOR_USER_PASSWORD: ${{ secrets.INVESTOR_USER_PASSWORD }}
          NEW_USER_EMAIL: ${{ secrets.NEW_USER_EMAIL }}
          NEW_USER_PASSWORD: ${{ secrets.NEW_USER_PASSWORD }}
          LOCKED_USER_EMAIL: ${{ secrets.LOCKED_USER_EMAIL }}
          LOCKED_USER_PASSWORD: ${{ secrets.LOCKED_USER_PASSWORD }}
          LEARNER_USER_EMAIL: ${{ secrets.LEARNER_USER_EMAIL }}
          LEARNER_USER_PASSWORD: ${{ secrets.LEARNER_USER_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: reports/
          retention-days: 14

      - name: Upload failure artifacts (screenshots, traces, videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-failure-evidence
          path: test-artifacts/
          retention-days: 14

      - name: Fail pipeline on release-blocking failures
        if: failure()
        run: |
          echo "Critical regression failures detected - treat as release-blocking per QA policy."
          exit 1
